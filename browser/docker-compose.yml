services:
  openclaw-cdp-browser:
    container_name: openclaw-cdp-browser
    image: openclaw-cdp-browser:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_GATEWAY_BIND:?set HOST_GATEWAY_BIND}:9223:9223"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=1g
    shm_size: 1g
    pids_limit: 512
    mem_limit: 2g
    cpus: 2

  openclaw-memory-db:
    profiles:
      - memory
    container_name: openclaw-memory-db
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../state/memory-service.env
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - openclaw-memory-db-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  openclaw-memory-service:
    profiles:
      - memory
    container_name: openclaw-memory-service
    image: openclaw-memory-service:local
    build:
      context: .
      dockerfile: Dockerfile.memory-service
    restart: unless-stopped
    depends_on:
      openclaw-memory-db:
        condition: service_healthy
    env_file:
      - ../state/memory-service.env
    ports:
      - "${HOST_GATEWAY_BIND:?set HOST_GATEWAY_BIND}:9004:9004"
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    pids_limit: 256
    mem_limit: 256m
    cpus: 1

  openclaw-nvidia-proxy:
    profiles:
      - nvidia-proxy
    container_name: openclaw-nvidia-proxy
    image: openclaw-nvidia-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.nvidia-proxy
    restart: unless-stopped
    env_file:
      - ../state/nvidia-proxy.env
    ports:
      - "${HOST_GATEWAY_BIND:?set HOST_GATEWAY_BIND}:9002:9002"
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    pids_limit: 256
    mem_limit: 256m
    cpus: 1

  openclaw-anthropic-proxy:
    profiles:
      - anthropic-proxy
    container_name: openclaw-anthropic-proxy
    image: openclaw-anthropic-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.anthropic-proxy
    restart: unless-stopped
    env_file:
      - ../state/anthropic-proxy.env
    ports:
      - "${HOST_GATEWAY_BIND:?set HOST_GATEWAY_BIND}:9005:9005"
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    pids_limit: 256
    mem_limit: 256m
    cpus: 1

  openclaw-perplexity-proxy:
    profiles:
      - perplexity-proxy
    container_name: openclaw-perplexity-proxy
    image: openclaw-perplexity-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.perplexity-proxy
    restart: unless-stopped
    env_file:
      - ../state/perplexity-proxy.env
    ports:
      - "${HOST_GATEWAY_BIND:?set HOST_GATEWAY_BIND}:9003:9003"
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    pids_limit: 256
    mem_limit: 256m
    cpus: 1

volumes:
  openclaw-memory-db-data:
